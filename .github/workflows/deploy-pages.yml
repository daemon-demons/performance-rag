name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Node 24 action runtimes — see
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history / writeable main for docs publish
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build
          touch dist/.nojekyll

      - name: Verify production build (not Vite source HTML)
        run: |
          test -f dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "dist/index.html still points at /src/main.jsx — vite build failed"
            exit 1
          fi
          grep -q '/performance-rag/assets/' dist/index.html

      # Publish built site into main:/docs (Pages → branch main → folder /docs)
      # Avoids JamesIves worktree conflict when deploying onto the same branch.
      - name: Publish dist to docs on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf docs
          mkdir -p docs
          cp -a dist/. docs/

          git add -f docs
          if git diff --staged --quiet; then
            echo "No docs changes to publish"
            exit 0
          fi

          git commit -m "Deploy production build to docs [skip ci]"
          git push origin HEAD:main
