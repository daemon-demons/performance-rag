name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Node 24 action runtimes — see
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build
          touch dist/.nojekyll

      - name: Verify production build (not Vite source HTML)
        run: |
          test -f dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "dist/index.html still points at /src/main.jsx — vite build failed"
            exit 1
          fi
          grep -q '/performance-rag/assets/' dist/index.html

      # Publish built site into main:/docs (GitHub Pages → branch main → folder /docs)
      - name: Deploy dist to main/docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: main
          target-folder: docs
          clean: true
          single-commit: true
          commit-message: 'Deploy production build to docs [skip ci]'
