name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Node 24 — https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install, test, lint, and build
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          touch dist/.nojekyll

      - name: Verify production build
        run: |
          test -f dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "::error::dist still references /src/main.jsx"
            exit 1
          fi
          test -d dist/assets
          grep -E 'src="/performance-rag/assets/|href="/performance-rag/assets/' dist/index.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: site-dist
          path: dist

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Deploy production build
