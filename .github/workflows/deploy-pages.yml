name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Node 24 action runtimes — see
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#
# REQUIRED (one-time): Repo Settings → Pages → Source = "GitHub Actions"
# (not "Deploy from a branch"). Branch/root serves Vite source and blanks the site.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build
          touch dist/.nojekyll

      - name: Verify production build
        run: |
          test -f dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "::error::dist still references /src/main.jsx — not a Vite production build"
            exit 1
          fi
          grep -q '/performance-rag/assets/' dist/index.html
          test -d dist/assets
          ls dist/assets/*.js >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
